<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>מערכת התחברות</title>
</head>
<body>
    <div class="container">
        <div id="choiceSection">
            <h2>ברוך הבא!</h2>
            <p style="text-align: center;">האם אתה משתמש רשום?</p>
            <div style="text-align: center; margin-bottom: 20px;">
                <button onclick="showLogin()">כן, אני רשום</button>
                <button onclick="showSignUp()">לא, אני חדש</button>
            </div>
        </div>

        <div id="usersSection"></div>

        <!-- טופס התחברות -->
        <form id="loginForm" style="display: none;" onsubmit="event.preventDefault(); submitForm('login');">
            <h2>התחברות</h2>
            <input type="email" name="email" placeholder="אימייל" required>
            <input type="password" name="password" placeholder="סיסמה" required>
            <button type="submit">התחבר</button>
            <div class="link">
                <a href="#" onclick="showForgotPassword()">שכחתי סיסמה</a>
            </div>
        </form>

        <!-- טופס הרשמה -->
        <form id="signupForm" style="display: none;" onsubmit="event.preventDefault(); submitForm('signup');">
            <h2>הרשמה</h2>
            <input type="text" name="username" placeholder="שם משתמש" required>
            <input type="email" name="email" placeholder="אימייל" required>
            <input type="password" name="password" placeholder="סיסמה" required>
            <button type="submit">הרשם</button>
        </form>

        <!-- טופס שכחתי סיסמה -->
        <form id="forgotPasswordForm" style="display: none;" onsubmit="event.preventDefault(); submitForm('forgot_password');">
            <h2>שכחתי סיסמה</h2>
            <input type="email" name="email" placeholder="אימייל" required>
            <button type="submit">אפס סיסמה</button>
        </form>
    </div>

    <!-- חלון Popup -->
    <div id="popup" class="popup">
        <div id="popupContent" class="popup-content">
            <h3 id="popupTitle"></h3>
            <p id="popupMessage"></p>
            <button class="close-btn" onclick="closePopup()">סגור</button>
        </div>
    </div>
</body>
</html>
